# Managed by vps-wizard
# Matches clients producing bursts of 4xx responses in the reverse proxy's
# JSON access log (Caddy or Traefik). Bots probing for /wp-login.php, .env,
# phpmyadmin etc. trip this quickly; real users almost never do.
[Definition]
# JSON field order differs between proxies (and Traefik does not guarantee it),
# so match the client IP either before or after the status code.
failregex = ^.*"(remote_ip|client_ip|ClientHost)":\s*"<HOST>(:\d+)?".*"(status|DownstreamStatus)":\s*(400|401|403|404|405|429)\D
            ^.*"(status|DownstreamStatus)":\s*(400|401|403|404|405|429)\D.*"(remote_ip|client_ip|ClientHost)":\s*"<HOST>(:\d+)?"
ignoreregex =
datepattern = {{DATEPATTERN}}
