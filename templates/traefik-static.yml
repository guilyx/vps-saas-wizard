# Managed by vps-wizard - Traefik static configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: WARN

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

ping:
  entryPoint: traefik

entryPoints:
  traefik:
    address: "127.0.0.1:8082"
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    transport:
      respondingTimeouts:
        readTimeout: 30s
        idleTimeout: 120s
{{TRAEFIK_FORWARDED_HEADERS}}
  websecure:
    address: ":443"
    http3: {}
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - rate-limit@file
        - inflight@file
        - compress@file
    transport:
      respondingTimeouts:
        readTimeout: 30s
        idleTimeout: 120s
{{TRAEFIK_FORWARDED_HEADERS}}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{PROXY_EMAIL}}"
      storage: /acme/acme.json
      tlsChallenge: {}

api:
  dashboard: false
  insecure: false
