# Managed by vps-wizard - OpenSSH hardening drop-in.
# Validate with: sshd -t
Port {{SSH_PORT}}
Protocol 2
AddressFamily any

# Authentication
PermitRootLogin {{SSH_PERMIT_ROOT}}
PasswordAuthentication {{SSH_PASSWORD_AUTH}}
KbdInteractiveAuthentication {{SSH_PASSWORD_AUTH}}
ChallengeResponseAuthentication {{SSH_PASSWORD_AUTH}}
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey{{SSH_EXTRA_AUTH_METHODS}}
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
UsePAM yes

# Restrict who may log in
AllowUsers {{SSH_ALLOW_USERS}}

# Session hardening
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
Compression no
PrintMotd no
Banner none

# Modern crypto only
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com

LogLevel VERBOSE
